<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rodízio de Cultos</title>
<style>
  :root{ --border:#7a7a7a; --blue:#dbe7ff; --orange:#f4e0c8; --red:#f8d6d6; --titlebar:#cfcfcf; }
  body{ font-family: Arial, sans-serif; margin:0; background:#f7f7f7; color:#111; }
  .wrap{max-width:1100px;margin:18px auto;padding:16px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  h1{font-size:28px;margin:0 0 6px;text-align:center}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:12px}
  button{cursor:pointer;padding:8px;border:1px solid #888;background:#eee}
  .btn-primary{background:#2e6be6;color:#fff;border-color:#2e6be6}
  .btn-pdf{background:#c62828;color:#fff;border-color:#b71c1c}
  .btn-lock{background:#f0a500;color:#fff;border-color:#d49200;font-weight:bold}
  #painelEditores {display:none;margin-bottom:12px}
  .panel{display:flex;gap:16px;flex-wrap:wrap;}
  .card{flex:1 1 360px;padding:12px;border:1px solid var(--border);background:#fff}
  textarea.oper{width:100%;min-height:90px;padding:8px;box-sizing:border-box;}
  .title-bar{text-align:center;padding:8px;border:1px solid var(--border);background:var(--titlebar);font-weight:700;margin-bottom:8px}
  table.sheet{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:14px}
  table.sheet th, table.sheet td{border:1px solid var(--border);padding:8px}
  .destaque-amarelo{background-color:#ffeb3b; font-weight:bold; color:#d32f2f;}
  .editavel[contenteditable="true"]:focus{outline:2px solid #2e6be6; background:#fffbe6;}
  .btn-destaque{padding:4px 8px; font-size:12px; border-radius:4px;}
  .hint{text-align:center; font-size:12px; color:#555; margin-bottom:10px;}

  .pdf-uma-folha {
    width: 740px !important;
    padding: 6px 10px !important;
    box-sizing: border-box !important;
    background: #fff !important;
  }
  .pdf-uma-folha h1 {
    font-size: 18px !important;
    margin: 0 0 8px 0 !important;
  }
  .pdf-uma-folha .title-bar {
    padding: 3px 6px !important;
    font-size: 11px !important;
    margin: 5px 0 0 0 !important;
  }
  .pdf-uma-folha table.sheet {
    margin: 0 0 6px 0 !important;
    font-size: 10px !important;
  }
  .pdf-uma-folha table.sheet th,
  .pdf-uma-folha table.sheet td {
    padding: 2.5px 6px !important;
    line-height: 1.15 !important;
  }

  @media print {
    .controls, #painelEditores, .hint, .col-acao, .btn-destaque { display: none !important; }
    body { background: #fff; }
    .wrap { box-shadow: none; margin: 0; padding: 0; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<div class="wrap">
  <div id="pdfArea">
    <h1>RODÍZIO MÊS DE <span id="previewMes">—</span></h1>
    <div class="controls">
      <input id="monthPick" type="month" />
      <button id="btnGenerate" class="btn-primary">Gerar Rodízio</button>
      <button id="btnPDF" class="btn-pdf">Exportar PDF</button>
      <button id="btnLock" class="btn-lock" onclick="verificarSenha()">🔓 Editar</button>
    </div>
    <div id="hintAdm" class="hint" style="display:none;">Modo ADM ativo: clique nas células para editar ou use "Destacar".</div>
    <div id="painelEditores" class="panel">
      <div class="card">
          <label><strong>Culto (Dom/Ter/Qui)</strong></label><textarea id="opsCulto" class="oper">DANIEL&#10;FABIO&#10;CESA&#10;ROMULO</textarea>
          <label><strong>Reunião Jovens</strong></label><textarea id="opsReuniao" class="oper">DANIEL F.N&#10;JONATAS</textarea>
          <label><strong>Ensaio</strong></label><textarea id="opsEnsaio" class="oper">JONATAS</textarea>
          <label><strong>Culto Jovens</strong></label><textarea id="opsCultoJovem" class="oper">FABIO</textarea>
      </div>
    </div>
    <div id="resultArea"></div>
  </div>
</div>

<script>
const monthShort = ['JAN.','FEV.','MAR.','ABR.','MAI.','JUN.','JUL.','AGO.','SET.','OUT.','NOV.','DEZ.'];
const dayName = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const SENHA_ADM = "1234";
let isAdm = false;

function carregarDados() {
  const salvos = localStorage.getItem('ccb_listas_salvas');
  if (salvos) {
    const dados = JSON.parse(salvos);
    if (dados.culto) document.getElementById('opsCulto').value = dados.culto;
    if (dados.reuniao) document.getElementById('opsReuniao').value = dados.reuniao;
    if (dados.ensaio) document.getElementById('opsEnsaio').value = dados.ensaio;
    if (dados.jovens) document.getElementById('opsCultoJovem').value = dados.jovens;
  }
}

function salvarDados() {
  const dados = {
    culto: document.getElementById('opsCulto').value,
    reuniao: document.getElementById('opsReuniao').value,
    ensaio: document.getElementById('opsEnsaio').value,
    jovens: document.getElementById('opsCultoJovem').value
  };
  localStorage.setItem('ccb_listas_salvas', JSON.stringify(dados));
}

function obterEdicoesMes(chaveMes) {
  const todas = JSON.parse(localStorage.getItem('ccb_edicoes_tabela') || '{}');
  return todas[chaveMes] || {};
}

function salvarEdicaoCelula(chaveMes, linhaId, campo, valor) {
  if (!isAdm) return;
  const todas = JSON.parse(localStorage.getItem('ccb_edicoes_tabela') || '{}');
  if (!todas[chaveMes]) todas[chaveMes] = {};
  if (!todas[chaveMes][linhaId]) todas[chaveMes][linhaId] = {};
  todas[chaveMes][linhaId][campo] = valor;
  localStorage.setItem('ccb_edicoes_tabela', JSON.stringify(todas));
}

function alternarDestaqueLinha(chaveMes, linhaId) {
  if (!isAdm) return;
  const todas = JSON.parse(localStorage.getItem('ccb_edicoes_tabela') || '{}');
  if (!todas[chaveMes]) todas[chaveMes] = {};
  if (!todas[chaveMes][linhaId]) todas[chaveMes][linhaId] = {};
  const atual = !!todas[chaveMes][linhaId].destaque;
  todas[chaveMes][linhaId].destaque = !atual;
  localStorage.setItem('ccb_edicoes_tabela', JSON.stringify(todas));
  gerarRodizio();
}

function contarEventos(ano1, mes1, ano2, mes2, diasDesejados) {
  let count = 0;
  let d1 = new Date(ano1, mes1, 1, 12);
  let d2 = new Date(ano2, mes2, 1, 12);
  let sinal = d1 < d2 ? 1 : -1;
  let atual = new Date(d1 < d2 ? d1 : d2);
  let limite = new Date(d1 < d2 ? d2 : d1);
  
  while(atual < limite) {
    if(diasDesejados.includes(atual.getDay())) count++;
    atual.setDate(atual.getDate() + 1);
  }
  return count * sinal;
}

function gerarRodizio() {
  if (isAdm) salvarDados();

  const [y, m] = document.getElementById('monthPick').value.split('-').map(Number);
  const mi = m - 1;
  const chaveMes = `${y}-${String(m).padStart(2,'0')}`;
  const edicoes = obterEdicoesMes(chaveMes);
  document.getElementById('previewMes').textContent = monthShort[mi] + ' - ' + y;
  
  const oC = document.getElementById('opsCulto').value.split('\n').filter(s => s.trim() !== '');
  const oR = document.getElementById('opsReuniao').value.split('\n').filter(s => s.trim() !== '');
  const oE = document.getElementById('opsEnsaio').value.split('\n').filter(s => s.trim() !== '');
  const oJ = document.getElementById('opsCultoJovem').value.split('\n').filter(s => s.trim() !== '');
  
  const allDays = [];
  for(let d=1; d<=new Date(y, m, 0).getDate(); d++){ allDays.push(new Date(y, mi, d)); }
  
  let diffC = contarEventos(2026, 7, y, mi, [0, 2, 4]);
  let pC = ((diffC % oC.length) + oC.length) % oC.length;
  
  let diffR = contarEventos(2026, 7, y, mi, [0]);
  let pR = ((diffR % oR.length) + oR.length) % oR.length;
  
  let diffMeses = (y - 2026) * 12 + (mi - 7);
  let pE = ((diffMeses % oE.length) + oE.length) % oE.length;
  let pJ = ((diffMeses % oJ.length) + oJ.length) % oJ.length;

  function renderLinha(linhaId, colunas, destaquePadrao) {
    const ed = edicoes[linhaId] || {};
    const destacado = ed.destaque !== undefined ? ed.destaque : destaquePadrao;
    const cl = destacado ? "class='destaque-amarelo'" : "";
    const tds = colunas.map((c, idx) => {
      const val = ed['col' + idx] !== undefined ? ed['col' + idx] : c.texto;
      if (isAdm) {
        return `<td class="editavel" contenteditable="true" onblur="salvarEdicaoCelula('${chaveMes}','${linhaId}','col${idx}',this.innerText.trim())">${val}</td>`;
      }
      return `<td>${val}</td>`;
    }).join('');
    const btn = isAdm
      ? `<td class="col-acao" style="text-align:center; width:90px;"><button class="btn-destaque" onclick="alternarDestaqueLinha('${chaveMes}','${linhaId}')">${destacado ? '★ Destaque' : '☆ Destacar'}</button></td>`
      : "";
    return `<tr ${cl}>${tds}${btn}</tr>`;
  }

  const thAcao = isAdm ? `<th class="col-acao">Ação</th>` : "";
  
  // 1. CULTOS
  let hC = `<div class="title-bar">CULTOS</div><table class="sheet"><tr><th>DIA</th><th>DATA</th><th>IRMÃO</th>${thAcao}</tr>`;
  const doms = allDays.filter(d => d.getDay() === 0);
  
  allDays.forEach(dt => {
    if([0, 2, 4].includes(dt.getDay())){
      let nome = oC[pC++ % oC.length], destPadrao = false;
      
      if (mi % 2 === 0 && dt.getDay() === 0 && doms.indexOf(dt) === 1) { nome += " — BATISMO"; destPadrao = true; }
      
      const linhaId = `culto_${dt.getDate()}`;
      hC += renderLinha(linhaId, [{texto: dayName[dt.getDay()]}, {texto: `${dt.getDate()}-${monthShort[mi]}`}, {texto: nome}], destPadrao);
    }
  });

  // 2. OUTROS
  let hR = `<div class="title-bar" style="background:var(--blue)">REUNIÃO JOVENS</div><table class="sheet"><tr><th>DATA</th><th>IRMÃO</th>${thAcao}</tr>` +
    allDays.filter(d=>d.getDay()==0).map((d, idx) => renderLinha(`reuniao_${idx}`, [{texto: `${d.getDate()}-${monthShort[mi]}`}, {texto: oR[pR++ % oR.length]}], false)).join('') + `</table>`;

  let ensaioD = allDays.filter(d=>d.getDay()==5)[1];
  let hE = `<div class="title-bar" style="background:var(--orange)">ENSAIO</div><table class="sheet"><tr><th>DATA</th><th>IRMÃO</th>${thAcao}</tr>` +
    renderLinha('ensaio_0', [{texto: ensaioD ? `${ensaioD.getDate()}-${monthShort[mi]}` : ''}, {texto: oE[pE] || ''}], false) + `</table>`;

  let cultoJD = allDays.filter(d=>d.getDay()==6)[1];
  let hJ = `<div class="title-bar" style="background:var(--red)">CULTO JOVENS</div><table class="sheet"><tr><th>DATA</th><th>IRMÃO</th>${thAcao}</tr>` +
    renderLinha('jovens_0', [{texto: cultoJD ? `${cultoJD.getDate()}-${monthShort[mi]}` : ''}, {texto: oJ[pJ] || ''}], false) + `</table>`;
  
  document.getElementById('resultArea').innerHTML = hC + "</table>" + hR + hE + hJ;
}

function verificarSenha() {
  const p = document.getElementById('painelEditores');
  const btn = document.getElementById('btnLock');
  const hint = document.getElementById('hintAdm');

  if (isAdm) {
    salvarDados();
    isAdm = false;
    p.style.display = "none";
    hint.style.display = "none";
    btn.textContent = "🔓 Editar";
    gerarRodizio();
    return;
  }

  if (prompt("Senha do ADM:") === SENHA_ADM) {
    isAdm = true;
    p.style.display = "block";
    hint.style.display = "block";
    btn.textContent = "🔒 Bloquear";
    gerarRodizio();
  }
}

function exportarPDFUmaFolha() {
  const original = document.getElementById("pdfArea");
  const clone = original.cloneNode(true);
  clone.classList.add("pdf-uma-folha");
  clone.querySelectorAll(".controls, #painelEditores, #hintAdm, .col-acao, .btn-destaque").forEach(el => el.remove());

  const wrapper = document.createElement("div");
  wrapper.style.position = "fixed";
  wrapper.style.left = "-9999px";
  wrapper.style.top = "0";
  wrapper.style.width = "740px";
  wrapper.style.background = "#fff";
  wrapper.appendChild(clone);
  document.body.appendChild(wrapper);

  const mesTexto = document.getElementById('previewMes').textContent;
  const opt = {
    margin: [6, 8, 6, 8],
    filename: `Rodizio_${mesTexto}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, windowWidth: 760 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['avoid-all'] }
  };

  html2pdf().set(opt).from(clone).toPdf().get('pdf').then((pdf) => {
    const totalPaginas = pdf.internal.getNumberOfPages();
    for (let i = totalPaginas; i > 1; i--) {
      pdf.deletePage(i);
    }
  }).save().then(() => {
    wrapper.remove();
  });
}

document.getElementById('btnGenerate').addEventListener('click', gerarRodizio);
document.getElementById('btnPDF').addEventListener('click', exportarPDFUmaFolha);

carregarDados();

document.getElementById('monthPick').value = new Date().getFullYear() + '-' + String(new Date().getMonth()+1).padStart(2,'0');
gerarRodizio();
</script>
</body>
</html>
